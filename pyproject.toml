[project]
name = "mmbot"
version = "0.2.0"
description = "Custom multi-venue market-making bot: Perpl, Phoenix, Variational, Arcus"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
phoenix = ["phoenix-trade>=0.1.9"]
variational = ["variational>=0.6.0"]
lighter = ["lighter-sdk>=1.1.2"]
all = ["phoenix-trade>=0.1.9", "variational>=0.6.0", "lighter-sdk>=1.1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
mmbot = "mmbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mmbot*"]
