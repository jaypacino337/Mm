[project]
name = "perpl-mm"
version = "0.1.0"
description = "Custom market-making bot for the Perpl perpetual futures DEX on Monad"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
perpl-mm = "perpl_mm.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["perpl_mm"]
